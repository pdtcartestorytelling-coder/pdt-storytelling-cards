name: Export approved PdT images

on:
  pull_request:
    paths:
      - scripts/export-edition-images.cjs
      - .github/workflows/export-edition-images.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install image pipeline
        run: npm install --no-save --no-package-lock --ignore-scripts sharp@0.34.4
      - name: Render 3 edition crops in WebP and AVIF
        run: node scripts/export-edition-images.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: hq-edition-crops
          path: |
            images/pdt-essential-hq.webp
            images/pdt-studio-hq.webp
            images/pdt-signature-hq.webp
            images/pdt-essential-hq.avif
            images/pdt-studio-hq.avif
            images/pdt-signature-hq.avif
