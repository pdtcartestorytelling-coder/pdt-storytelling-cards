name: Site Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate HTML links, assets and sitemap
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check interest.js
          node --check guida-informativa.js
