name: Site Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate HTML links, assets and sitemap
        run: python3 scripts/check_site.py
      - name: Assemble isolated QA-only web tree (NO-GO)
        run: |
          python3 scripts/build_release_qa.py --out "$RUNNER_TEMP/pdt-qa"
          echo "PDT_WEB_ROOT=$RUNNER_TEMP/pdt-qa/web" >> "$GITHUB_ENV"
          echo "PDT_TEST_OUTPUT=$GITHUB_WORKSPACE/browser-test-screenshots" >> "$GITHUB_ENV"
      - name: Validate isolated web tree
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check "$PDT_WEB_ROOT/script.js"
          node --check "$PDT_WEB_ROOT/interest.js"
          node --check "$PDT_WEB_ROOT/guida-informativa.js"
          node --check "$PDT_WEB_ROOT/pdt-motion.js"
          node --check "$PDT_WEB_ROOT/pdt-shop.js"

      - name: Install browser smoke dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24
      - name: Mail form security and marketing suspension (IT EN ES)
        run: timeout 90s node scripts/form_security.cjs
      - name: Accessibility keyboard and no-JS regression
        run: timeout 120s node scripts/accessibility_smoke.cjs
      - name: Verify AVIF image container and dimensions
        run: |
          file images/pdt-editions-hq.avif
      - name: Browser smoke test (IT EN ES / mobile desktop)
        run: timeout 150s node scripts/browser_smoke.cjs
      - name: UX and local performance lab (IT EN ES)
        run: timeout 120s node scripts/ux_performance.cjs
      - name: Verify isolation and integrity after tests
        run: python3 scripts/verify_release_qa.py "$RUNNER_TEMP/pdt-qa"
      - name: Save QA manifest (metadata only, NOT web package)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdt-qa-manifest-NO-GO
          path: ${{ runner.temp }}/pdt-qa/qa-manifest.json
          if-no-files-found: ignore
      - name: Save local performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdt-performance-lab
          path: browser-test-screenshots/performance-lab.json
          if-no-files-found: ignore
      - name: Save responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdt-browser-screenshots
          path: browser-test-screenshots/*.png
          if-no-files-found: ignore
